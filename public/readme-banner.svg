    <text x="984" y="188" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">172</text>
    <text x="1034" y="188" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650">sets synced</text>
