<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pokemon eBay Web Admin</title>
  <desc id="desc">A clean README banner for the Pokemon eBay Web Admin project.</desc>

  <rect width="1280" height="320" rx="28" fill="#ffffff"/>
  <rect x="1" y="1" width="1278" height="318" rx="27" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="72" y="76" width="72" height="72" rx="18" fill="#111827"/>
  <text x="108" y="120" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">TCG</text>

  <text x="176" y="96" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" letter-spacing="3">POKEMON TCG LISTING ADMIN</text>
  <text x="176" y="154" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="900">Pokemon eBay Web Admin</text>
  <text x="178" y="196" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">A routed Next.js dashboard for generating cleaner eBay listing copy.</text>

  <g>
