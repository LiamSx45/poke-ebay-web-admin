    <text x="236" y="257" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850">Search</text>

    <rect x="312" y="232" width="118" height="38" rx="19" fill="#eff6ff"/>
    <text x="371" y="257" text-anchor="middle" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850">Sets</text>

    <rect x="446" y="232" width="132" height="38" rx="19" fill="#fffbeb"/>
    <text x="512" y="257" text-anchor="middle" fill="#b45309" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850">Listings</text>

    <rect x="594" y="232" width="152" height="38" rx="19" fill="#f8fafc"/>
    <text x="670" y="257" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850">TCG Data</text>
